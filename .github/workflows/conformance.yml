name: conformance-core
on:
  pull_request:
    paths:
      - 'packages/toolbox-core/**'
      - '!packages/toolbox-core/**/*.md'

permissions: read-all

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ./packages/toolbox-core
    permissions:
      contents: 'read'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install test requirements
        run: pip install -e .[test]

      - name: Install library requirements
        run: pip install -r requirements.txt

      - name: Run Conformance Tests
        uses: modelcontextprotocol/conformance@21a9a2febd7100d7c17ac1021ee7f2ed9f66a1e0 # v0.1.16
        with:
          mode: client
          command: 'python packages/toolbox-core/tests/conformance/client.py'
          suite: core
          expected-failures: packages/toolbox-core/tests/conformance-baseline.yml
