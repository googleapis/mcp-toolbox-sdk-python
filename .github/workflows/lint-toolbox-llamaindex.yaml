name: llamaindex
on:
  pull_request:
    paths:
      - 'packages/toolbox-llamaindex/**'
      - '!packages/toolbox-llamaindex/**/*.md'

# Declare default permissions as read only.
permissions: read-all

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ./packages/toolbox-llamaindex
    permissions:
      contents: 'read'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install test requirements
        run: pip install -e .[test]

      - name: Install library requirements
        run: pip install -r requirements.txt

      - name: Run linters
        run: |
          black --check .
          isort --check .

      - name: Run type-check
        env:
          MYPYPATH: './src'
        run: mypy --install-types --non-interactive --cache-dir=.mypy_cache/ -p toolbox_llamaindex
